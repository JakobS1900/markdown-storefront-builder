<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Storefront builder</title>
    <meta
      name="description"
      content="Build a commission page, a price list, or an art showcase, and get Markdown you can paste straight into rentry and similar sites. No Markdown knowledge needed."
    />
    <meta name="color-scheme" content="light dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <meta name="theme-color" content="#7a4bd6" />
    <link rel="icon" href="./icon-192.png" />
    <link rel="apple-touch-icon" href="./icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Storefront" />
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <!--
      A skip link, first in the tab order. Every section list on a built page
      can grow long, and without this a keyboard user tabs through every
      section control before reaching the editor.
    -->
    <a class="skip" href="#surface">Skip to the editor</a>

    <div id="app"></div>

    <main id="old-webview" hidden>
      <h1>Update Android System WebView</h1>
      <p>This device can install the app, but its web engine is too old to run it. Update Android System WebView, then reopen the app.</p>
    </main>

    <!--
      Announcements for assistive technology. Saving, a section moving, and a
      warning appearing all happen away from where the user is looking, and are
      silent without this.
    -->
    <div id="live-region" class="sr-only" role="status" aria-live="polite" aria-atomic="true"></div>

    <noscript>
      <p style="padding: 1rem">
        This editor needs JavaScript to run. Everything happens in your browser, and nothing is
        sent anywhere.
      </p>
    </noscript>

    <script>
      (function () {
        var agent = navigator.userAgent;
        var chrome = /Chrome\/(\d+)/.exec(agent);
        if (/Android/.test(agent) && chrome && Number(chrome[1]) < 60) {
          document.getElementById("app").hidden = true;
          document.getElementById("old-webview").hidden = false;
        }
      })();
    </script>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
