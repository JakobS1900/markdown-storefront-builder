# Publishes the app to GitHub Pages.
#
# Runs only after `verify` has passed on master, so a broken build cannot become
# the live site. That ordering is the whole point of having it as a separate
# workflow rather than another job in the same one.
name: deploy

on:
  workflow_run:
    workflows: ["verify"]
    branches: [master]
    types: [completed]
  # Available by hand for a re-deploy that does not need a new commit.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and never cancel one in flight. Interrupting a
# deploy can leave the site serving half of two builds.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # Only when verify actually succeeded. A workflow_run fires on failure too.
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - run: npm ci

      # Expected to be unset, and the deploy is correct that way.
      #
      # IMGUR_CLIENT_ID is deliberately not configured on this repository, so
      # this resolves to empty, no upload button is built, and the image field
      # asks for a web address instead. One shared key would make a single
      # artist's upload able to get the whole application banned, taking
      # uploads down for every user at once. The README has the full reasoning.
      #
      # Setting the repository variable turns uploading on for everybody who
      # uses the published site. That is a deliberate choice with a real cost,
      # not a configuration step someone should complete because it looks
      # unfinished. It is a variable rather than a secret because a Client-ID
      # is a public identifier that ships in the bundle either way.
      - run: npm run build:app
        env:
          VITE_IMGUR_CLIENT_ID: ${{ vars.IMGUR_CLIENT_ID }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

      - id: deployment
        uses: actions/deploy-pages@v4
